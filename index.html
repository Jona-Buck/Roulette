<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>Roulette – Europäisch (Spielgeld)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="siteHeader">
    <h1>Roulette</h1>
  </header>

  <div id="hud">
    <div><span class="label">Guthaben</span><span class="value" id="bal">0 €</span></div>
    <div class="hud-div"></div>
    <div><span class="label">Einsatz</span><span class="value" id="staked">0 €</span></div>
  </div>

  <div id="stageLayout">
    <section id="wheelZone">
      <div id="wheelStage">
        <div id="wheelWrap">
          <canvas id="wheelCanvas"></canvas>
          <canvas id="ballCanvas"></canvas>
        </div>
      </div>
      <div id="resultBanner"></div>
      <div id="historyPanel">
        <span class="panel-label">Verlauf</span>
        <div id="historyBar"></div>
      </div>
    </section>

    <section id="tableZone">
      <div id="tableOuter">
        <div id="tableWrap">
          <div id="zeroCell"></div>
          <div id="gridStage"></div>
          <div id="colBtns"></div>
        </div>
        <div id="dozensRow"></div>
        <div id="outsideRow"></div>
      </div>
      <p id="scrollHint">&#8592; horizontal wischen &#8594;</p>

      <div id="trayRow">
        <div id="chipTray"></div>
      </div>

      <div id="controls">
        <button class="action secondary" id="undoBtn">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-1"/></svg>
          <span>Zurück</span>
        </button>
        <button class="action secondary" id="clearBtn">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M6 7l1 12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-12"/></svg>
          <span>Löschen</span>
        </button>
        <button class="action primary" id="spinBtn">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-3-6.2"/><path d="M20 4v5h-5"/></svg>
          <span>Drehen</span>
        </button>
      </div>
    </section>
  </div>
</div>

<div id="brokeModal">
  <div class="modal-box">
    <h2>Guthaben aufgebraucht</h2>
    <p>Dein Guthaben reicht für keinen Einsatz mehr.</p>
    <button class="action primary" id="brokeReset">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-3-6.2"/><path d="M20 4v5h-5"/></svg>
      <span>Neu starten (1000 €)</span>
    </button>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/bets.js"></script>
<script src="js/wheel.js"></script>
<script src="js/engine.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
